# NVIDIA GPU (Linux with the NVIDIA Container Toolkit, or Windows + WSL2): the real driving model runs on it
# (tinygrad over OpenCL). Added by the launcher when settings say gpu = nvidia.
services:
  comma:
    environment:
      OCL_ICD_VENDORS: /etc/OpenCL/only-nvidia   # the NVIDIA driver as OpenCL platform 0, not pocl's CPU
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu, compute, utility, graphics]}]
